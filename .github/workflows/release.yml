name: release

on:
  push:
    tags: ['v*']
  pull_request:
    branches: [dev, main]
    paths:
      - 'ds5-bridge/**'
      - 'vds/**'
      - 'installer/**'
      - 'scripts/collect-vds-bin.sh'
      - 'packaging/aur/opends5-bin/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:

jobs:
  appimage:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      # Optional: forks without the webhook secret skip the Discord notice.
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      # package.json's version is the source of truth: it names the artifact,
      # is shown in the app, and (since the dkms.conf stamp) is the DKMS module
      # version. The tag only names the Release, so a tag that disagrees would
      # publish "v1.7.0" containing a 1.6.3 artifact installing vds_hcd/1.6.3.
      # Fail before the build rather than after publishing.
      - name: verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          pkg="$(node -p "require('./ds5-bridge/companion/package.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$pkg" != "$tag" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match package.json version ${pkg}"
            echo "bump ds5-bridge/companion/package.json to ${tag}, or retag as v${pkg}"
            exit 1
          fi
          echo "ok: tag ${GITHUB_REF_NAME} matches package.json ${pkg}"

      - name: deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ pkg-config \
            libbluetooth-dev libdbus-1-dev libopus-dev libudev-dev

      # vds-bin/ is gitignored and consumed via extraResources, so the
      # userspace bundle has to exist before electron-builder stages it.
      - name: build vds-bin
        run: bash scripts/collect-vds-bin.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ds5-bridge/companion/package-lock.json

      - name: install
        working-directory: ds5-bridge/companion
        run: npm ci

      - name: build AppImage
        working-directory: ds5-bridge/companion
        run: npm run installer:linux

      # The default electron-builder toolset ships a 2019 runtime that dlopens
      # libfuse.so.2, which fails on fuse3-only distros. toolsets.appimage 1.0.2
      # selects a runtime with libfuse3 linked in statically. Guard the swap so a
      # toolset regression can't silently ship a libfuse2-dependent AppImage.
      - name: verify static-fuse3 runtime
        working-directory: ds5-bridge/companion
        run: |
          appimage="$(find artifacts/installer -maxdepth 1 -name '*.AppImage' -print -quit)"
          [ -n "$appimage" ] || { echo "no AppImage produced"; exit 1; }
          offset="$("$appimage" --appimage-offset)"
          head -c "$offset" "$appimage" > /tmp/runtime.bin
          if readelf -d /tmp/runtime.bin | grep -q NEEDED; then
            echo "runtime is dynamically linked; expected a static runtime:"
            readelf -d /tmp/runtime.bin | grep NEEDED
            exit 1
          fi
          if strings -a /tmp/runtime.bin | grep -q 'libfuse\.so\.2'; then
            echo "runtime still depends on libfuse2"
            exit 1
          fi
          echo "ok: static runtime, no libfuse2 ($offset bytes)"

      # The updater refuses to install an AppImage it cannot verify, so the
      # checksum ships as a release asset beside it. sha256sum runs from inside
      # the artifact directory so the recorded name is a bare basename, which is
      # the `<64-hex>  <file>` shape the client's parseSha256Asset expects.
      - name: checksum AppImage
        working-directory: ds5-bridge/companion
        run: |
          appimage="$(find artifacts/installer -maxdepth 1 -name '*.AppImage' -print -quit)"
          [ -n "$appimage" ] || { echo "no AppImage produced"; exit 1; }
          ( cd "$(dirname "$appimage")" && sha256sum "$(basename "$appimage")" > "$(basename "$appimage").sha256" )
          cat "${appimage}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: OpenDS5-AppImage
          path: ds5-bridge/companion/artifacts/installer/*.AppImage

      - name: publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A semver prerelease tag (v1.7.0-beta.1) ships from dev without
          # becoming "Latest release" on the repo page -- main stays the stable
          # line. A plain v1.7.0 publishes as a normal release.
          prerelease=""
          case "${GITHUB_REF_NAME}" in
            *-*) prerelease="--prerelease" ;;
          esac
          # Notes come from the tag's "## [x.y.z]" section of CHANGELOG.md, with its
          # "###" subsections promoted to "##"; without one, fall back to GitHub's
          # generated notes.
          awk -v v="${GITHUB_REF_NAME#v}" '
            /^## / {
              if (found) exit
              h = $0; sub(/^## \[?/, "", h); split(h, part, /[] ]/)
              if (part[1] == v) { found = 1; next }
            }
            /^---$/ { next }
            found
          ' CHANGELOG.md | sed 's/^### /## /' > /tmp/release-notes.md
          # "## [x.y.z] - date — summary" titles the release "vx.y.z — summary".
          summary="$(grep -m1 "^## \[${GITHUB_REF_NAME#v}\]" CHANGELOG.md | sed -n 's/^.* — //p')"
          title="OpenDS5 ${GITHUB_REF_NAME}"
          [ -n "$summary" ] && title="${GITHUB_REF_NAME} — ${summary}"
          if [ -s /tmp/release-notes.md ]; then
            notes=(--notes-file /tmp/release-notes.md)
          else
            echo "no CHANGELOG.md section for ${GITHUB_REF_NAME}; generating notes"
            notes=(--generate-notes)
          fi
          gh release create "${GITHUB_REF_NAME}" \
            --title "${title}" \
            --target "${GITHUB_SHA}" \
            "${notes[@]}" \
            ${prerelease} \
            ds5-bridge/companion/artifacts/installer/*.AppImage \
            ds5-bridge/companion/artifacts/installer/*.AppImage.sha256

      # The release above is created with GITHUB_TOKEN, which by design does not
      # fire the `release: published` event -- so a standalone notifier workflow
      # would never run. Instead we read the just-published release back and hand
      # its title/body/url to the action via its manual (workflow_dispatch) inputs.
      - name: read published release
        if: startsWith(github.ref, 'refs/tags/v')
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "url=$(gh release view "${GITHUB_REF_NAME}" --json url --jq .url)"
            echo 'body<<RELEASE_BODY_EOF'
            gh release view "${GITHUB_REF_NAME}" --json body --jq .body
            echo 'RELEASE_BODY_EOF'
          } >> "${GITHUB_OUTPUT}"

      - name: notify Discord
        if: startsWith(github.ref, 'refs/tags/v') && env.DISCORD_WEBHOOK != ''
        uses: SethCohen/github-releases-to-discord@v1
        with:
          webhook_url: ${{ secrets.DISCORD_WEBHOOK }}
          username: "OpenDS5 Releases"
          release_name: "OpenDS5 ${{ github.ref_name }}"
          release_body: ${{ steps.release.outputs.body }}
          release_html_url: ${{ steps.release.outputs.url }}
          reduce_headings: true
          footer_timestamp: true

  # Arch/CachyOS package built from the AppImage above with the opends5-bin
  # PKGBUILD, so `sudo pacman -U <release url>` installs vdsd, the DKMS module and
  # the setup hook without an AUR helper. Pull requests only check that it builds.
  pacman:
    needs: appimage
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: OpenDS5-AppImage
          path: appimage

      - name: build package
        run: |
          version="$(sed -n 's/^ *"version": *"\([^"]*\)".*/\1/p' ds5-bridge/companion/package.json | head -n 1)"
          appimage="$(find appimage -maxdepth 1 -name '*.AppImage' -print -quit)"
          [ -n "$appimage" ] || { echo "no AppImage artifact"; exit 1; }
          work=/tmp/opends5-bin
          cp -r packaging/aur/opends5-bin "$work"
          cp "$appimage" "$work/OpenDS5-${version}.AppImage"
          # Point the PKGBUILD at this build's AppImage; makepkg uses the local file
          # instead of downloading it.
          sum="$(sha256sum "$work/OpenDS5-${version}.AppImage" | cut -d' ' -f1)"
          sed -i "s/^pkgver=.*/pkgver=${version}/; s/^pkgrel=.*/pkgrel=1/; s/^sha256sums=('[0-9a-f]*'/sha256sums=('${sum}'/" "$work/PKGBUILD"
          useradd -m builder
          chown -R builder: "$work"
          # -d: the runtime dependencies are only needed on the target machine.
          (cd "$work" && runuser -u builder -- makepkg -d --noconfirm)
          mkdir -p dist
          cp "$work"/opends5-bin-*.pkg.tar.zst dist/
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: OpenDS5-pacman
          path: dist/*.pkg.tar.zst

      - name: attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pacman -Sy --noconfirm github-cli
          gh release upload "${GITHUB_REF_NAME}" dist/*.pkg.tar.zst --repo "${GITHUB_REPOSITORY}" --clobber

  # The Windows installer and its checksum, which the Windows app's update
  # check looks for (OpenDS5-Companion-Setup-x.y.z.exe + .exe.sha256). Runs
  # after the AppImage job because that job creates the Release.
  windows:
    needs: appimage
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: locate vcpkg
        shell: pwsh
        run: |
          $Vcpkg = Get-Command vcpkg.exe -ErrorAction SilentlyContinue
          $VcpkgPath = if ($Vcpkg) { $Vcpkg.Source } else { "C:\vcpkg\vcpkg.exe" }
          "VDS_VCPKG_ROOT=$(Split-Path -Parent $VcpkgPath)" | Out-File -FilePath $env:GITHUB_ENV -Append

      # vds-win/ is gitignored and consumed via extraResources.
      - name: build vdsd
        shell: pwsh
        run: |
          cmake -S vds -B vds\build-win `
            -DVDS_STATIC_MSVC_RUNTIME=ON `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static `
            -DCMAKE_TOOLCHAIN_FILE="$env:VDS_VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake"
          cmake --build vds\build-win --config Release --parallel --target vdsd vdsctl
          New-Item -ItemType Directory -Force -Path vds-win | Out-Null
          Copy-Item vds\build-win\Release\vdsd.exe, vds\build-win\Release\vdsctl.exe vds-win\
          $Dlls = Get-ChildItem vds\build-win\Release\*.dll -ErrorAction SilentlyContinue
          if ($Dlls) { throw "vdsd is not self-contained; it needs: $($Dlls.Name -join ', ')" }

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ds5-bridge/companion/package-lock.json

      - name: install
        working-directory: ds5-bridge/companion
        run: npm ci

      - name: test
        working-directory: ds5-bridge/companion
        run: |
          npx vitest run src
          npm run test:installer

      - name: build installer
        working-directory: ds5-bridge/companion
        run: |
          npm run build
          npx electron-builder --win nsis --x64 --publish never

      # sha256sum's "<hash>  <name>" line, the format the update check parses.
      - name: checksum
        shell: pwsh
        working-directory: ds5-bridge/companion/artifacts/installer
        run: |
          $Exe = Get-ChildItem OpenDS5-Companion-Setup-*.exe | Select-Object -First 1
          if (!$Exe) { throw "no installer was built" }
          $Hash = (Get-FileHash $Exe.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("$($Exe.FullName).sha256", "$Hash  $($Exe.Name)`n")
          Get-Content "$($Exe.FullName).sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: OpenDS5-Windows-Setup
          path: |
            ds5-bridge/companion/artifacts/installer/OpenDS5-Companion-Setup-*.exe
            ds5-bridge/companion/artifacts/installer/OpenDS5-Companion-Setup-*.exe.sha256
          if-no-files-found: error

      - name: attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: ds5-bridge/companion/artifacts/installer
        run: |
          $Files = @(Get-ChildItem OpenDS5-Companion-Setup-*.exe, OpenDS5-Companion-Setup-*.exe.sha256 | ForEach-Object { $_.Name })
          gh release upload "$env:GITHUB_REF_NAME" @Files --repo "$env:GITHUB_REPOSITORY" --clobber
